<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ext Install</title>
  <style>
    body { width: 360px; margin: 0; padding: 18px; font: 14px system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .card { padding: 12px; border: 1px solid #d0d7de; border-radius: 8px; }
    .url { display: block; margin-top: 8px; overflow-wrap: anywhere; }
    .muted { color: #57606a; }
    button, a { display: inline-block; margin-top: 10px; padding: 7px 12px; border-radius: 6px; }
    button { border: 1px solid #1f2328; background: #1f2328; color: white; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    a { border: 1px solid #d0d7de; text-decoration: none; color: inherit; }
    #status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Ext Install</h1>
  <div class="card">
    <strong>Browser Action Target</strong>
    <span id="repo" class="url">Detecting current tab…</span>
    <p id="status" class="muted">URL → browser action. Research/installation logic can stay in the Skill.</p>
    <button id="inspect" type="button">Open in browser</button>
    <div><a id="open" href="#" target="_blank" rel="noopener noreferrer" hidden>Open target</a></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
